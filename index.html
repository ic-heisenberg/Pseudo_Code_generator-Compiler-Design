<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PseudoGen — Code to Pseudocode</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0b0e14;
      --surface:   #121720;
      --surface2:  #1a2030;
      --border:    #2a3448;
      --accent:    #5affa0;
      --accent2:   #5ab4ff;
      --warn:      #ff6b6b;
      --text:      #e8edf5;
      --muted:     #6b7a96;
      --font-head: 'Syne', sans-serif;
      --font-code: 'Space Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-code);
      overflow-x: hidden;
    }

    /* ── Background grid ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(90,255,160,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(90,255,160,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 28px 40px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .logo-name {
      font-family: var(--font-head);
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .logo-name span { color: var(--accent); }
    .logo-tag {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .header-badge {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ── Main grid ── */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    /* ── Panel ── */
    .panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      min-height: 0;
    }
    .panel:last-child { border-right: none; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      gap: 12px;
    }

    .panel-title {
      font-family: var(--font-head);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Language toggle ── */
    .lang-toggle {
      display: flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .lang-btn {
      padding: 5px 14px;
      font-family: var(--font-code);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
    }
    .lang-btn.active {
      color: var(--bg);
      background: var(--accent);
    }
    .lang-btn:not(.active):hover { color: var(--text); }

    /* ── Code editor area ── */
    .editor-wrap {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .line-numbers {
      padding: 20px 0 20px 14px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.75;
      text-align: right;
      user-select: none;
      min-width: 42px;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    #code-input {
      flex: 1;
      padding: 20px 20px;
      font-family: var(--font-code);
      font-size: 0.82rem;
      line-height: 1.75;
      color: var(--text);
      background: var(--surface);
      border: none;
      outline: none;
      resize: none;
      tab-size: 4;
      caret-color: var(--accent);
    }
    #code-input::selection { background: rgba(90,255,160,0.18); }
    #code-input::placeholder { color: var(--muted); opacity: 0.6; }

    /* ── Output panel ── */
    .output-panel {
      display: flex;
      flex-direction: column;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .status-dot.ok  { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status-dot.err { background: var(--warn);   box-shadow: 0 0 8px var(--warn); }

    .copy-btn {
      font-family: var(--font-code);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .copy-btn.copied { color: var(--accent); border-color: var(--accent); }

    #output {
      flex: 1;
      padding: 20px;
      font-family: var(--font-code);
      font-size: 0.82rem;
      line-height: 1.75;
      color: var(--text);
      background: var(--bg);
      overflow-y: auto;
      white-space: pre;
      tab-size: 2;
    }

    #output.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.78rem;
      white-space: normal;
      text-align: center;
    }

    #output.error { color: var(--warn); }

    /* Syntax-highlight classes */
    .kw  { color: var(--accent2); font-weight: 700; }
    .kw2 { color: var(--accent); }
    .op  { color: #c792ea; }
    .num { color: #f78c6c; }

    /* ── Footer / run bar ── */
    .run-bar {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .run-info {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .run-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 24px;
      font-family: var(--font-head);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
    }
    .run-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity 0.18s;
    }
    .run-btn:hover::after { opacity: 0.1; }
    .run-btn:active { transform: scale(0.97); }
    .run-btn.loading {
      background: var(--muted);
      pointer-events: none;
    }
    .run-btn.loading .btn-text { opacity: 0.5; }

    /* Spinner */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    .run-btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Token count badge ── */
    .token-count {
      font-size: 0.65rem;
      color: var(--muted);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ── Sample snippets ── */
    .samples {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sample-chip {
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .sample-chip:hover {
      color: var(--accent2);
      border-color: var(--accent2);
    }

    /* ── Responsive ── */
    @media (max-width: 820px) {
      .workspace { grid-template-columns: 1fr; }
      .panel { border-right: none; border-bottom: 1px solid var(--border); }
      header { padding: 16px 20px; }
    }

    /* ── Fade-in animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .app { animation: fadeUp 0.4s ease both; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-name">Pseudo<span>Gen</span></div>
      <div class="logo-tag">Code → Pseudocode</div>
    </div>
    <div class="header-badge">v2.0 · C &amp; Python</div>
  </header>

  <div class="workspace">
    <!-- Left: Input -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Source Code</span>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="samples" id="samples"></div>
          <div class="lang-toggle">
            <button class="lang-btn active" data-lang="c">C</button>
            <button class="lang-btn" data-lang="python">Python</button>
          </div>
        </div>
      </div>
      <div class="editor-wrap">
        <div class="line-numbers" id="line-numbers">1</div>
        <textarea
          id="code-input"
          spellcheck="false"
          placeholder="// Paste or type your code here…"
        ></textarea>
      </div>
      <div class="run-bar">
        <div>
          <div class="run-info" id="token-info">0 characters</div>
          <div class="samples" style="margin-top:6px;" id="samples-mobile"></div>
        </div>
        <button class="run-btn" id="run-btn" onclick="runParser()">
          <span class="spinner"></span>
          <span class="btn-text">▶ Generate</span>
        </button>
      </div>
    </div>

    <!-- Right: Output -->
    <div class="panel output-panel">
      <div class="output-header panel-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="status-dot" id="status-dot"></div>
          <span class="panel-title">Pseudocode</span>
        </div>
        <button class="copy-btn" id="copy-btn" onclick="copyOutput()">Copy</button>
      </div>
      <div id="output" class="empty">
        Output will appear here.<br/>Select a language and click Generate.
      </div>
    </div>
  </div>
</div>

<script>
  // ── State ──
  let currentLang = 'c';

  const SAMPLES = {
    c: [
      {
        label: 'If / Else',
        code: `int x = 10;\nif (x > 5) {\n    x = x - 1;\n} else {\n    x = x + 1;\n}`
      },
      {
        label: 'While Loop',
        code: `int i = 0;\nwhile (i < 10) {\n    i = i + 1;\n}`
      },
      {
        label: 'For Loop',
        code: `int sum = 0;\nfor (i = 0; i < 5; i = i + 1) {\n    sum = sum + i;\n}`
      }
    ],
    python: [
      {
        label: 'If / Elif',
        code: `x = 10\nif x > 5:\n    x = x - 1\nelif x == 0:\n    x = 99\nelse:\n    x = x + 1`
      },
      {
        label: 'While Loop',
        code: `i = 0\nwhile i < 10:\n    i = i + 1`
      },
      {
        label: 'For Loop',
        code: `total = 0\nfor item in items:\n    total = total + item`
      },
      {
        label: 'Function',
        code: `def greet(name):\n    print(name)\n    return name`
      }
    ]
  };

  // ── Language toggle ──
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLang = btn.dataset.lang;
      const input = document.getElementById('code-input');
      input.placeholder = currentLang === 'c'
        ? '// Paste or type your C code here…'
        : '# Paste or type your Python code here…';
      renderSamples();
      resetOutput();
    });
  });

  // ── Samples ──
  function renderSamples() {
    const list = SAMPLES[currentLang];
    ['samples'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = list.map((s, i) =>
        `<span class="sample-chip" onclick="loadSample(${i})">${s.label}</span>`
      ).join('');
    });
  }

  function loadSample(i) {
    document.getElementById('code-input').value = SAMPLES[currentLang][i].code;
    updateLineNumbers();
    updateCharCount();
    resetOutput();
  }

  // ── Line numbers ──
  const codeInput = document.getElementById('code-input');
  const lineNumbers = document.getElementById('line-numbers');

  function updateLineNumbers() {
    const lines = codeInput.value.split('\n').length;
    lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
  }

  function updateCharCount() {
    const len = codeInput.value.length;
    const lines = codeInput.value.split('\n').length;
    document.getElementById('token-info').textContent =
      `${len} chars · ${lines} lines`;
  }

  codeInput.addEventListener('input', () => {
    updateLineNumbers();
    updateCharCount();
  });

  codeInput.addEventListener('scroll', () => {
    lineNumbers.scrollTop = codeInput.scrollTop;
  });

  // Tab key → insert spaces
  codeInput.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = codeInput.selectionStart;
      const end = codeInput.selectionEnd;
      codeInput.value = codeInput.value.substring(0, start) + '    ' + codeInput.value.substring(end);
      codeInput.selectionStart = codeInput.selectionEnd = start + 4;
      updateLineNumbers();
    }
  });

  // ── Output ──
  function resetOutput() {
    const out = document.getElementById('output');
    out.className = 'empty';
    out.innerHTML = 'Output will appear here.<br/>Select a language and click Generate.';
    document.getElementById('status-dot').className = 'status-dot';
  }

  function highlightPseudo(text) {
    const keywords = ['BEGIN','END','IF','THEN','ELSE','ELIF','END IF','WHILE','DO','END WHILE',
                      'FOR','END FOR','FOR EACH','IN','FUNCTION','END FUNCTION','RETURN',
                      'DECLARE','SET','OUTPUT','CALL','INITIALIZE','UPDATE','AND','OR','NOT'];
    const arrowKeywords = ['←'];
    let escaped = text
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');

    // Highlight control-flow keywords
    keywords.forEach(kw => {
      escaped = escaped.replace(
        new RegExp(`\\b${kw}\\b`, 'g'),
        `<span class="kw">${kw}</span>`
      );
    });

    // Highlight arrow
    escaped = escaped.replace(/←/g, '<span class="op">←</span>');

    // Highlight numbers
    escaped = escaped.replace(/\b(\d+(\.\d+)?)\b/g, '<span class="num">$1</span>');

    return escaped;
  }

  // ── Main parse call ──
  async function runParser() {
    const code = document.getElementById('code-input').value.trim();
    if (!code) return;

    const btn = document.getElementById('run-btn');
    const out = document.getElementById('output');
    const dot = document.getElementById('status-dot');

    btn.classList.add('loading');
    btn.querySelector('.btn-text').textContent = 'Parsing…';
    out.className = '';
    out.textContent = '';
    dot.className = 'status-dot';

    try {
      const resp = await fetch('/parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, language: currentLang })
      });
      const data = await resp.json();

      if (data.error) {
        out.className = 'error';
        out.textContent = '⚠ ' + data.error;
        dot.className = 'status-dot err';
      } else {
        out.className = '';
        out.innerHTML = highlightPseudo(data.pseudocode);
        dot.className = 'status-dot ok';
      }
    } catch (err) {
      out.className = 'error';
      out.textContent = '⚠ Network error: ' + err.message;
      dot.className = 'status-dot err';
    } finally {
      btn.classList.remove('loading');
      btn.querySelector('.btn-text').textContent = '▶ Generate';
    }
  }

  // ── Copy ──
  function copyOutput() {
    const out = document.getElementById('output');
    const text = out.innerText;
    if (!text || out.classList.contains('empty')) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
    });
  }

  // ── Keyboard shortcut: Ctrl+Enter ──
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runParser();
  });

  // ── Init ──
  renderSamples();
  updateLineNumbers();
</script>
</body>
</html>
